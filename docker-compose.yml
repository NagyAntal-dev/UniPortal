# ============================================================================
# UniPortal — a teljes rendszer: felület + önálló (self-hosted) Supabase.
#
#   Első alkalommal (egyszer):   ./init-env.sh https://uniportal.pelda.hu
#   Indítás és frissítés:        docker compose up -d --build
#
# Szolgáltatások:
#   web      a UniPortal felülete (nginx, :8080) — ugyanazon a címen továbbítja
#            a Supabase API-t is (auth, rest, realtime, storage, functions)
#   migrate  egyszer fut indításkor: felviszi a supabase/NN_*.sql migrációkat
#            (deploy/migrate/manifest.txt), a már lefutottakat kihagyja, és
#            lezárja a nyilvános jelszavú demó fiókokat
#   saml-sp  NJE SAML bejelentkezés + automatikus regisztráció (/saml/*)
#   + a hivatalos Supabase stack (deploy/supabase, rögzített verzió):
#     db, auth, rest, realtime, storage, imgproxy, meta, functions, api-gw,
#     studio, supavisor
#
# A .env COMPOSE_FILE sora ehhez a fájlhoz hozzáveszi a deploy/compose.uniportal.yml
# réteget is (a belső portok csak a szerverről érhetők el; levélsablon).
# Részletek: DEPLOY.md
# ============================================================================
name: uniportal

include:
  - path: deploy/supabase/docker-compose.yml
    env_file: .env

services:
  migrate:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${UNIPORTAL_MIGRATE_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      # A futtató ebből ellenőrzi, hogy a .env titkai ki vannak-e töltve.
      UNIPORTAL_SECRET_CHECK: "${JWT_SECRET}|${ANON_KEY}|${POSTGRES_PASSWORD}"
      UNIPORTAL_DEMO_ACCOUNTS: ${UNIPORTAL_DEMO_ACCOUNTS:-lock}
    volumes:
      - ./supabase:/uniportal/migrations:ro
      - ./deploy/migrate:/uniportal/bin:ro
    entrypoint: ["/bin/sh", "/uniportal/bin/run.sh"]

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    image: uniportal-web:latest
    restart: unless-stopped
    ports:
      - "${UNIPORTAL_HTTP_PORT:-8080}:8080"
    environment:
      # Üresen: a böngésző a saját címén éri el az API-t (a web továbbítja).
      UNIPORTAL_SUPABASE_URL: ${UNIPORTAL_SUPABASE_URL:-}
      UNIPORTAL_SUPABASE_ANON_KEY: ${ANON_KEY}
      API_GW_UPSTREAM: api-gw:8000
      # ---- Sebességkorlát (deploy/web/10-uniportal-defaults.envsh) ----
      # Üresen hagyva a képbe épített alapérték érvényes. A megbízható proxy
      # címét ÉLESBEN mindenképp állítsd be, különben a korlát minden
      # látogatót egy vödörbe tesz. Lásd DEPLOY.md, 5. pont.
      UNIPORTAL_TRUSTED_PROXY: ${UNIPORTAL_TRUSTED_PROXY:-}
      UNIPORTAL_RL_AUTH: ${UNIPORTAL_RL_AUTH:-}
      UNIPORTAL_RL_AUTH_BURST: ${UNIPORTAL_RL_AUTH_BURST:-}
      UNIPORTAL_RL_AUTHGEN: ${UNIPORTAL_RL_AUTHGEN:-}
      UNIPORTAL_RL_API: ${UNIPORTAL_RL_API:-}
      UNIPORTAL_RL_API_BURST: ${UNIPORTAL_RL_API_BURST:-}
      UNIPORTAL_RL_FN: ${UNIPORTAL_RL_FN:-}
      UNIPORTAL_RL_FN_BURST: ${UNIPORTAL_RL_FN_BURST:-}
      UNIPORTAL_RL_STORAGE: ${UNIPORTAL_RL_STORAGE:-}
      UNIPORTAL_RL_STORAGE_BURST: ${UNIPORTAL_RL_STORAGE_BURST:-}
      UNIPORTAL_CONN_LIMIT: ${UNIPORTAL_CONN_LIMIT:-}
    depends_on:
      api-gw:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # SZÁNDÉKOSAN nem függ a saml-sp-től: ha az (pl. hiányzó SAML-kulcs miatt)
    # nem indul, a felület és a jelszavas belépés akkor is működjön — csak a
    # /saml/ ad 502-t. Az nginx a címet kérésenként oldja fel.

  # NJE SAML bejelentkezés (saját service provider, docs/nje-saml.md). Kifelé
  # nem nyit portot: a web a /saml/ útvonalat továbbítja ide. A GoTrue-t és a
  # PostgREST-et a belső hálózaton, a service_role kulccsal hívja.
  saml-sp:
    build:
      context: deploy/saml-sp
    image: uniportal-saml-sp:latest
    restart: unless-stopped
    environment:
      UNIPORTAL_PUBLIC_URL: ${UNIPORTAL_PUBLIC_URL}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      GOTRUE_URL: http://auth:9999
      POSTGREST_URL: http://rest:3000
      SAML_SP_ENTITY_ID: ${SAML_SP_ENTITY_ID:-}
      SAML_SP_PATH: ${SAML_SP_PATH:-/saml}
      SAML_SP_PRIVATE_KEY: ${SAML_SP_PRIVATE_KEY:-}
      SAML_SP_CERT: ${SAML_SP_CERT:-}
      SAML_COOKIE_SECRET: ${SAML_COOKIE_SECRET:-}
      SAML_IDP_ENTITY_ID: ${SAML_IDP_ENTITY_ID:-https://idp.nje.hu/simplesaml/saml2/idp/metadata.php}
      SAML_IDP_SSO_URL: ${SAML_IDP_SSO_URL:-https://idp.nje.hu/simplesaml/saml2/idp/SSOService.php}
      SAML_IDP_SLO_URL: ${SAML_IDP_SLO_URL:-https://idp.nje.hu/simplesaml/saml2/idp/SingleLogoutService.php}
      SAML_IDP_METADATA_URL: ${SAML_IDP_METADATA_URL:-}
      SAML_IDP_CERT: ${SAML_IDP_CERT:-}
    depends_on:
      auth:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
