<html lang="hu">

  <link rel="preload" as="image" href="assets/eloadoterem.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Futásidejű beállítás (Dockerben a .env-ből; GitHub Pages-en üres). -->
  <script src="config.js"></script>
  <script>
    window.SUPABASE_URL = window.SUPABASE_URL || 'https://mdccyastwhzwtyukxlpk.supabase.co';
    window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_S6syNS_lBfb93fT54WaLJg_aYNDqv9M';
    /* Nyelv: az alkalmazás beállítása (nje_lang), különben a böngészőé — mint a többi oldalon. */
    window.NJE_LANG = 'hu';
    try { window.NJE_LANG = localStorage.getItem('nje_lang') || ((navigator.language || '').toLowerCase().indexOf('hu') === 0 ? 'hu' : 'en'); } catch (e) {}
    if (window.NJE_LANG !== 'en') window.NJE_LANG = 'hu';
    /* A jelszó-visszaállító link ne itt jelentkeztessen be, hanem a saját oldalán. */
    window.__RECOVERY_REDIRECT = /(^|[#&])type=recovery(&|$)/.test(location.hash);
    if (window.__RECOVERY_REDIRECT) location.replace('reset-password.html' + location.hash);
    // NJE SAML: a bejelentkezési token az app.html-nek szól (ott váltjuk be).
    if (/(^|[#&])sso_token_hash=/.test(location.hash)) location.replace('app.html' + location.hash);
    try { window.sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY,
            window.__RECOVERY_REDIRECT ? { auth: { detectSessionInUrl: false } } : undefined); }
    catch (e) { console.error('Failed to init Supabase client', e); }
  </script>
  <style>
    :root {
      --accent: #d06700; --accent-dark: #943d00; --ink: #0f172a; --muted: #64748b;
      --line: rgba(15, 23, 42, .10); --field: rgba(248, 250, 252, .92);
      --err: #b91c1c; --err-bg: #fef2f2; --ok: #047857; --ok-bg: #ecfdf5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
      background: #1a120b url('assets/eloadoterem.jpg') center / cover no-repeat fixed;
      -webkit-font-smoothing: antialiased;
    }
    /* Finom, meleg sötétítés balról: a kép jobb oldala (a stúdium, a padsorok)
       megmarad, a kártya mögött viszont nyugodt a háttér. */
    .veil {
      position: fixed; inset: 0; pointer-events: none;
      background:
        linear-gradient(90deg, rgba(20, 12, 5, .78) 0%, rgba(20, 12, 5, .55) 34%, rgba(20, 12, 5, .12) 68%, rgba(20, 12, 5, .05) 100%),
        linear-gradient(0deg, rgba(20, 12, 5, .45) 0%, rgba(20, 12, 5, 0) 30%);
    }
    .page {
      position: relative; min-height: 100%;
      display: flex; flex-direction: column; justify-content: center;
      padding-inline: max(16px, 6vw); padding-block: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%; max-width: 400px;
      background: rgba(255, 255, 255, .90);
      -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, .6); border-radius: 28px;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .55);
      padding: 32px 30px 26px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .nje { font-size: 24px; font-weight: 900; letter-spacing: -.02em; color: var(--accent); }
    .brand .bar { width: 1px; height: 26px; background: #e2e8f0; }
    .brand .up { line-height: 1; }
    .brand .up b { display: block; font-size: 11px; font-weight: 900; letter-spacing: .18em; }
    .brand .up span { display: block; font-size: 9px; font-weight: 700; letter-spacing: .18em; color: #94a3b8; margin-top: 3px; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .lang { border: 0; background: transparent; font: inherit; font-size: 11px; font-weight: 900; letter-spacing: .06em;
            color: var(--muted); padding: 8px 10px; border-radius: 10px; cursor: pointer; }
    .lang:hover { background: rgba(15, 23, 42, .06); }
    h1 { margin: 26px 0 4px; font-size: 26px; font-weight: 900; letter-spacing: -.02em; text-wrap: balance; }
    .sub { margin: 0 0 22px; font-size: 14px; color: var(--muted); line-height: 1.5; }
    label { display: block; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 2px; }
    .field { margin-bottom: 14px; }
    input {
      width: 100%; font: inherit; font-size: 14px; color: var(--ink);
      background: var(--field); border: 1px solid var(--line); border-radius: 14px;
      padding: 13px 14px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #ffbf7a; box-shadow: 0 0 0 4px rgba(208, 103, 0, .14); }
    .pw { position: relative; }
    .pw input { padding-right: 46px; }
    .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent;
           width: 36px; height: 36px; border-radius: 10px; color: #94a3b8; cursor: pointer; display: grid; place-items: center; }
    .eye:hover { color: var(--ink); background: rgba(15, 23, 42, .05); }
    .row { display: flex; justify-content: flex-end; margin: -4px 0 16px; }
    .link { border: 0; background: none; font: inherit; font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; padding: 2px; }
    .link:hover { color: var(--accent-dark); text-decoration: underline; }
    .btn {
      width: 100%; border: 0; font: inherit; font-size: 14px; font-weight: 800; color: #fff; cursor: pointer;
      background: var(--accent); border-radius: 16px; padding: 14px; box-shadow: 0 12px 24px -10px rgba(208, 103, 0, .7);
      transition: background .15s, transform .1s;
    }
    .btn:hover { background: #b85200; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.alt { color: var(--ink); background: rgba(255, 255, 255, .95); border: 1px solid var(--line); box-shadow: none; }
    .btn.alt:hover { background: #f1f5f9; }
    .or { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-size: 10px; font-weight: 800;
          letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; }
    .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .msg { display: none; font-size: 12px; font-weight: 600; line-height: 1.5; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
    .msg.err { color: var(--err); background: var(--err-bg); border: 1px solid #fecaca; }
    .msg.ok { color: var(--ok); background: var(--ok-bg); border: 1px solid #a7f3d0; }
    .msg.on { display: block; }
    .back { display: block; margin: 14px auto 0; }
    .foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 14px;
            justify-content: space-between; font-size: 11px; color: var(--muted); }
    .foot a { color: var(--muted); text-decoration: none; font-weight: 600; }
    .foot a:hover { color: var(--accent); text-decoration: underline; }
    .credit { position: fixed; right: 16px; bottom: max(12px, env(safe-area-inset-bottom)); font-size: 11px; font-weight: 600;
              color: rgba(255, 255, 255, .72); text-shadow: 0 1px 2px rgba(0, 0, 0, .5); pointer-events: none; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 720px) {
      .page { align-items: center; }
      .veil { background: linear-gradient(180deg, rgba(20, 12, 5, .35) 0%, rgba(20, 12, 5, .70) 100%); }
      .card { padding: 26px 22px 22px; border-radius: 24px; }
      .credit { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="veil" aria-hidden="true"></div>
  <main class="page">
    <div class="card">
      <div class="top">
        <div class="brand" aria-label="NJE UniPortal">
          <span class="nje">NJE</span><span class="bar"></span>
          <span class="up"><b>UNIPORTAL</b><span>PRO</span></span>
        </div>
        <button class="lang" id="lang" type="button" title="Nyelv / Language"></button>
      </div>

      <!-- Belépés -->
      <form id="fLogin" novalidate>
        <h1 data-t="cim"></h1>
        <p class="sub" data-t="alcim"></p>
        <div class="msg err" id="eLogin" role="alert"></div>
        <div class="field">
          <label for="email" data-t="email"></label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="jelszo" data-t="jelszo"></label>
          <div class="pw">
            <input id="jelszo" type="password" autocomplete="current-password" required />
            <button class="eye" id="mutat" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="row"><button class="link" type="button" id="toForgot" data-t="elfelejtett"></button></div>
        <button class="btn" id="bLogin" type="submit" data-t="belepes"></button>
        <div class="or" data-t="vagy"></div>
        <button class="btn alt" id="bSso" type="button" data-t="sso"></button>
      </form>

      <!-- Elfelejtett jelszó -->
      <form id="fForgot" hidden novalidate>
        <h1 data-t="fcim"></h1>
        <p class="sub" data-t="falcim"></p>
        <div class="msg err" id="eForgot" role="alert"></div>
        <div class="msg ok" id="oForgot" aria-live="polite"></div>
        <div class="field">
          <label for="femail" data-t="email"></label>
          <input id="femail" type="email" autocomplete="email" required />
        </div>
        <button class="btn" id="bForgot" type="submit" data-t="kuldes"></button>
        <button class="link back" type="button" id="toLogin" data-t="vissza"></button>
      </form>

      <div class="foot">
        <a href="home.html#register" data-t="regisztracio"></a>
        <a href="home.html" data-t="rolunk"></a>
        <span><a href="privacy.html" data-t="adatvedelem"></a> · <a href="terms.html" data-t="feltetelek"></a></span>
      </div>
    </div>
  </main>
  <div class="credit" data-t="kep"></div>

  <script>
    /* ---- Szövegek (a forrás magyar; az angol a nyelvváltóval) ---- */
    var T = {
      hu: { cim: 'Belépés', alcim: 'Lépj be a Neumann János Egyetem UniPortal fiókodba.', email: 'E-mail-cím', jelszo: 'Jelszó',
            elfelejtett: 'Elfelejtett jelszó?', belepes: 'Belépés', belepesFolyamatban: 'Belépés…', fcim: 'Jelszó visszaállítása',
            falcim: 'Add meg az e-mail-címet, amellyel belépsz. Küldünk egy linket, amellyel új jelszót állíthatsz be.',
            kuldes: 'Visszaállító link küldése', kuldesFolyamatban: 'Küldés…', vissza: '← Vissza a belépéshez',
            regisztracio: 'Nincs még fiókod? Regisztráció', rolunk: 'A UniPortalról', vagy: 'vagy', sso: 'Belépés NJE-fiókkal',
            ssoHibak: { expired: 'Az NJE-belépés túl sokáig tartott, vagy már felhasználták. Kérjük, próbáld újra.',
              invalid_response: 'Az NJE-belépés válasza nem ellenőrizhető. Kérjük, próbáld újra.',
              missing_eppn: 'Az NJE azonosító szolgáltatás nem küldte el a felhasználónevedet. Kérjük, fordulj az informatikához.',
              missing_email: 'Az NJE azonosító szolgáltatás nem küldte el az e-mail-címedet. Kérjük, fordulj az informatikához.',
              provision_failed: 'A fiókodat nem sikerült létrehozni. Kérjük, próbáld újra később.',
              start_failed: 'Az NJE-belépést nem sikerült elindítani.',
              session_failed: 'Az NJE-belépés sikerült, de a munkamenet nem indult el. Kérjük, próbáld újra.' },
            ssoHiba: 'Az NJE-belépés nem sikerült. Kérjük, próbáld újra.', adatvedelem: 'Adatkezelési tájékoztató', feltetelek: 'Felhasználási feltételek',
            kep: 'Neumann János Egyetem · Kecskemét', mutat: 'Jelszó megjelenítése', elrejt: 'Jelszó elrejtése',
            hianyzik: 'Add meg az e-mail-címet és a jelszót.', hibas: 'Hibás e-mail-cím vagy jelszó.',
            nincsMegerositve: 'Az e-mail-cím még nincs megerősítve. Nézd meg a postafiókodat.',
            kapcsolat: 'Kapcsolódási hiba. Kérjük, próbáld újra.', sikertelen: 'A belépés nem sikerült.',
            tulSok: 'Túl sok kérés. Várj egy percet, mielőtt új linket kérsz.', keresHiba: 'A kérés nem sikerült. Kérjük, próbáld újra.',
            elkuldve: function (e) { return 'Ha létezik fiók a(z) ' + e + ' címhez, elküldtük rá az új jelszó beállításához szükséges linket. Nézd meg a postafiókodat (és a levélszemét mappát is).'; },
            lejart: 'Ez az e-mailes link érvénytelen vagy lejárt — minden link csak egyszer és korlátozott ideig működik. Ha jelszót állítottál vissza, kérj új linket.' },
      en: { cim: 'Sign in', alcim: 'Sign in to your John von Neumann University UniPortal account.', email: 'Email address', jelszo: 'Password',
            elfelejtett: 'Forgot password?', belepes: 'Sign in', belepesFolyamatban: 'Signing in…', fcim: 'Reset your password',
            falcim: "Enter the email address you sign in with. We'll send you a link to set a new password.",
            kuldes: 'Send reset link', kuldesFolyamatban: 'Sending…', vissza: '← Back to sign in',
            regisztracio: 'No account yet? Sign up', rolunk: 'About UniPortal', vagy: 'or', sso: 'Sign in with NJE account',
            ssoHibak: { expired: 'The NJE sign-in took too long or was already used. Please try again.',
              invalid_response: 'The NJE sign-in response could not be verified. Please try again.',
              missing_eppn: 'The NJE identity provider did not send your username. Please contact IT.',
              missing_email: 'The NJE identity provider did not send your email address. Please contact IT.',
              provision_failed: 'Your account could not be set up. Please try again later.',
              start_failed: 'NJE sign-in could not be started.',
              session_failed: 'NJE sign-in succeeded, but the session could not be started. Please try again.' },
            ssoHiba: 'NJE sign-in failed. Please try again.', adatvedelem: 'Privacy Notice', feltetelek: 'Terms of Use',
            kep: 'John von Neumann University · Kecskemét', mutat: 'Show password', elrejt: 'Hide password',
            hianyzik: 'Enter your email address and password.', hibas: 'Incorrect email address or password.',
            nincsMegerositve: 'Your email address is not confirmed yet. Check your inbox.',
            kapcsolat: 'Connection error. Please try again.', sikertelen: 'Sign-in failed.',
            tulSok: 'Too many requests. Please wait a minute before requesting another link.', keresHiba: 'The request failed. Please try again.',
            elkuldve: function (e) { return 'If an account exists for ' + e + ', we have sent it a link to set a new password. Check your inbox (and the spam folder).'; },
            lejart: 'This email link is invalid or has expired — each link works only once and for a limited time. If you were resetting your password, request a new link.' }
    };
    var L = T[window.NJE_LANG] || T.hu;
    function $(id) { return document.getElementById(id); }
    function alkalmaz() {
      document.documentElement.lang = window.NJE_LANG;
      document.title = (window.NJE_LANG === 'en' ? 'Sign in' : 'Belépés') + ' — UniPortal · ' + (window.NJE_LANG === 'en' ? 'John von Neumann University' : 'Neumann János Egyetem');
      document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = L[el.dataset.t]; });
      $('lang').textContent = window.NJE_LANG === 'en' ? 'EN' : 'HU';
      $('mutat').setAttribute('aria-label', L.mutat);
    }
    alkalmaz();
    $('lang').addEventListener('click', function () {
      window.NJE_LANG = window.NJE_LANG === 'en' ? 'hu' : 'en';
      try { localStorage.setItem('nje_lang', window.NJE_LANG); } catch (e) {}
      L = T[window.NJE_LANG]; alkalmaz();
    });

    function hiba(id, szoveg) { var el = $(id); el.textContent = szoveg; el.classList.add('on'); }
    function tisztit(id) { $(id).classList.remove('on'); }
    function belep() { window.location.href = 'app.html'; }

    /* Aki már be van lépve, azt nem tartjuk fel itt. */
    if (window.sb && !window.__RECOVERY_REDIRECT) {
      window.sb.auth.getSession().then(function (r) { if (r && r.data && r.data.session) belep(); }).catch(function () {});
    }

    $('mutat').addEventListener('click', function () {
      var i = $('jelszo'); var lathato = i.type === 'text';
      i.type = lathato ? 'password' : 'text';
      $('mutat').setAttribute('aria-label', lathato ? L.mutat : L.elrejt);
    });

    $('fLogin').addEventListener('submit', async function (e) {
      e.preventDefault(); tisztit('eLogin');
      var email = $('email').value.trim(), jelszo = $('jelszo').value;
      if (!email || !jelszo) { hiba('eLogin', L.hianyzik); return; }
      var b = $('bLogin'); b.disabled = true; b.textContent = L.belepesFolyamatban;
      try {
        var r = await window.sb.auth.signInWithPassword({ email: email, password: jelszo });
        if (r.error) {
          var m = r.error.message || '';
          hiba('eLogin', /Invalid login credentials/i.test(m) ? L.hibas : /Email not confirmed/i.test(m) ? L.nincsMegerositve : (m || L.sikertelen));
          b.disabled = false; b.textContent = L.belepes; return;
        }
        belep();
      } catch (err) { hiba('eLogin', L.kapcsolat); b.disabled = false; b.textContent = L.belepes; }
    });

    function nezet(forgot) {
      $('fLogin').hidden = forgot; $('fForgot').hidden = !forgot;
      tisztit('eLogin'); tisztit('eForgot'); tisztit('oForgot');
      if (forgot) { if (!$('femail').value) $('femail').value = $('email').value.trim(); setTimeout(function () { $('femail').focus(); }, 0); }
      else setTimeout(function () { $('email').focus(); }, 0);
    }
    $('toForgot').addEventListener('click', function () { nezet(true); });
    $('toLogin').addEventListener('click', function () { nezet(false); });

    /* A válasz szándékosan ugyanaz, akár létezik a fiók, akár nem — a felületről
       így nem deríthető ki, ki van regisztrálva. */
    $('fForgot').addEventListener('submit', async function (e) {
      e.preventDefault(); tisztit('eForgot'); tisztit('oForgot');
      var email = $('femail').value.trim(); if (!email) return;
      var b = $('bForgot'); b.disabled = true; b.textContent = L.kuldesFolyamatban;
      try {
        var r = await window.sb.auth.resetPasswordForEmail(email, { redirectTo: new URL('reset-password.html', window.location.href).href });
        if (r.error) {
          var rate = r.error.status === 429 || /rate limit|only request this after/i.test(r.error.message || '');
          hiba('eForgot', rate ? L.tulSok : (r.error.message || L.keresHiba));
        } else {
          var ok = $('oForgot'); ok.textContent = L.elkuldve(email); ok.classList.add('on');
        }
      } catch (err) { hiba('eForgot', L.kapcsolat); }
      b.disabled = false; b.textContent = L.kuldes;
    });

    /* NJE SAML belépés — ugyanaz, mint a régi nyitóoldalon (home.html): belépés
       után az app.html-re jön vissza egy egyszer használható tokennel. */
    $('bSso').addEventListener('click', function () {
      tisztit('eLogin'); $('bSso').disabled = true;
      window.location.assign(new URL('saml/login?next=app.html', window.location.href).href);
    });
    // Vissza gombbal (bfcache) ne maradjon letiltva a gomb.
    window.addEventListener('pageshow', function () { $('bSso').disabled = false; });
    (function () {
      var m = /(^|[#&])sso_error=([\w-]+)/.exec(location.hash);
      if (!m) return;
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      hiba('eLogin', L.ssoHibak[m[2]] || L.ssoHiba);
    })();

    /* Lejárt vagy már felhasznált e-mailes link (#error_code=…): megmondjuk, mi a teendő. */
    (function () {
      var hp = new URLSearchParams(location.hash.replace(/^#/, ''));
      if (location.hash === '#forgot') { nezet(true); return; }
      if (!hp.get('error_code') && !hp.get('error')) return;
      hiba('eLogin', L.lejart);
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    })();
  </script>
</body>
</html>
