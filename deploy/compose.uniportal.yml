# ============================================================================
# UniPortal-réteg a hivatalos Supabase-szolgáltatásokon. A .env COMPOSE_FILE
# sora tölti be, így a deploy/supabase fájljaihoz nem kell nyúlni.
#
# 1) Biztonság: kifelé CSAK a web (UNIPORTAL_HTTP_PORT, alapból 8080) nyíljon.
#    A hivatalos stack az API-átjárót (Studio + nyers API, :8000) és a
#    Supavisor adatbázis-portjait (:5432, :6543) minden interfészen kinyitja;
#    itt ezeket a szerver saját címére (127.0.0.1) korlátozzuk:
#      • Studio távolról:    ssh -L 8000:127.0.0.1:8000 <szerver>  →  http://localhost:8000
#      • adatbázis távolról: ssh -L 5432:127.0.0.1:5432 <szerver>
#
# 2) Jelszó-visszaállító levél: magyar/angol sablon, amelynek linkje a
#    reset-password.html oldalra visz (token_hash). A levelezők biztonsági
#    szűrői így nem tudják előre elhasználni az egyszer használható linket.
#    A sablont a web szolgáltatja: deploy/web/email/recovery.html
#
# 3) Edge Functions: a UniPortal függvényei közvetlenül a supabase/functions
#    könyvtárból, csak olvasásra csatolva — nincs másolat, ami elavulhatna.
#    Új függvénynél ide kell egy újabb sor. A titkaik a .env WHATSAPP_* soraiból.
#
# 4) Tároló és képátalakítás: mennyiségi korlátok. A /storage/v1/render/image/
#    útvonal alapból korlátlan, és ez a verem legolcsóbb túlterhelési pontja.
#
# 5) A mintafüggvény (hello) kitakarása: a hivatalos csomag példája
#    hitelesítés nélkül elérhető lenne.
# ============================================================================
services:
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"
  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION:-6543}:6543"
  auth:
    environment:
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://web:8080/email/recovery.html
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Új jelszó beállítása · Reset your password — UniPortal"
      # Az NJE SAML-t NEM a GoTrue kezeli, hanem a saját saml-sp szolgáltatás
      # (docker-compose.yml, docs/nje-saml.md) — a GOTRUE_SAML_* itt szándékosan nincs.
  functions:
    volumes:
      - ./supabase/functions/whatsapp-send:/home/deno/functions/whatsapp-send:ro,z
      - ./supabase/functions/whatsapp-webhook:/home/deno/functions/whatsapp-webhook:ro,z
    environment:
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      # Üres érték NEM jó (a függvény csak hiányzó változónál vált alapértékre).
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      # Percenként ennyi WhatsApp-üzenetet küldhet EGY ügyintéző (0 = nincs korlát).
      WHATSAPP_MAX_SENDS_PER_MINUTE: ${WHATSAPP_MAX_SENDS_PER_MINUTE:-20}
    # A hivatalos csomag mintafüggvénye (hello) hitelesítés nélkül elérhető
    # lenne a /functions/v1/hello címen. A vendorolt fát nem szerkesztjük,
    # ezért üres tmpfs-t borítunk rá: a futtató így nem találja meg.
    tmpfs:
      - /home/deno/functions/hello

  # 4) Tároló: a képátalakító útvonal (/storage/v1/render/image/…) alapból
  #    korlátlan, és ez a verem legolcsóbb túlterhelési pontja — egy kérés
  #    valódi CPU-t éget az imgproxyban. A beépített, memóriás számlálót
  #    kapcsoljuk be; nem kell hozzá Redis.
  storage:
    environment:
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_DRIVER: memory
      RATE_LIMITER_RENDER_PATH_MAX_REQ_SEC: ${STORAGE_RENDER_MAX_REQ_SEC:-5}
      RATE_LIMITER_SKIP_ON_ERROR: "true"

  # 5) Az imgproxy erőforrás-korlátai: egy óriási vagy sokkockás kép se tudja
  #    lefoglalni az egész gépet.
  imgproxy:
    environment:
      IMGPROXY_MAX_SRC_FILE_SIZE: ${IMGPROXY_MAX_SRC_FILE_SIZE:-20971520}
      IMGPROXY_CONCURRENCY: ${IMGPROXY_CONCURRENCY:-4}
      IMGPROXY_MAX_ANIMATION_FRAMES: ${IMGPROXY_MAX_ANIMATION_FRAMES:-1}
      IMGPROXY_DOWNLOAD_TIMEOUT: ${IMGPROXY_DOWNLOAD_TIMEOUT:-10}

  # 6) Jelzés a migrate szolgáltatásnak, hogy EZ A RÉTEG betöltődött. A fenti
  #    1) pont (a 127.0.0.1-re szűkített portok) KIZÁRÓLAG ezen a rétegen múlik,
  #    és a réteget a .env COMPOSE_FILE sora tölti be. Aki `docker compose -f
  #    docker-compose.yml up -d`-t ír, vagy elrontja azt a sort, észrevétlenül
  #    kinyitja a Studiót és a Postgres-poolert minden interfészen.
  migrate:
    environment:
      UNIPORTAL_LAYER: "on"
