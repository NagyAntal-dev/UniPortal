proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host $http_host;
# A proxy_read_timeout SZÁNDÉKOSAN nem itt van, hanem a server blokkban
# (default.conf.template): a /realtime/v1/ location felülírja 3600s-re, és az
# nginx ugyanazon a szinten kétszer megadott direktívát hibának tekinti
# ("directive is duplicate") — a szerver szintű alapérték viszont szabályosan
# felülírható egy location-ben.
