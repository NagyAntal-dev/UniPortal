# A /keycloak/ továbbítás fejlécei (deploy/web/default.conf.template).
# A proxy.conf-tól egyetlen ponton tér el: az X-Forwarded-For a realip utáni
# $remote_addr, vagyis a valós ügyfél EGY címe. A Keycloak ezt naplózza
# (események, brute-force védelem); a böngésző által küldött lánccal a cím
# hamisítható lenne.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host $http_host;
