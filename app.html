  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: rgb(208, 103, 0); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(184, 82, 0); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
    /* ============================================================
       Reszponzív tartalom — érintési célpontok kis kijelzőn
       ------------------------------------------------------------
       Mérés (Playwright, 390 px széles tartalomsáv, 49 nézet/fül): 301 gomb
       volt 44 px-nél alacsonyabb (a 602 láthatóból). Ezt egyesével nem
       érdemes osztályozni, ezért egy szabály emeli meg őket a mobil
       töréspont alatt. A hatókör a <main>: a benne ülő felső fejléc gombjai
       is beleesnek (ott ez kívánatos), az oldalsáv ikonsávja viszont nem.

       Az input/textarea/select 16 px-es betűje szándékos: ez alatt az iOS
       Safari ráközelít a mezőre fókuszkor, és a felhasználó kizoomolva
       marad. Csak mobilon aktív, asztali nézetben nincs hatása.
       ============================================================ */
    @media (max-width: 767px) {
      main button,
      main [role="button"],
      main summary { min-height: 44px; }
      main input:not([type="checkbox"]):not([type="radio"]),
      main select,
      main textarea { min-height: 44px; font-size: 16px; }
      /* A hosszú, tördelhetetlen azonosítók (API-kulcs, URL) ne feszítsék szét a lapot. */
      main code, main pre { overflow-wrap: anywhere; }
    }
    /* ============================================================
       Rács- és flex-elemek zsugorodása kis kijelzőn
       ------------------------------------------------------------
       MÉRVE (Playwright, 390 px, ECHO KAMPÁNYOK nézet): a lap TÖRZSE
       vízszintesen görgött — document.scrollingElement.scrollWidth 462 px
       volt 390 px-es viewportnál.

       Az ok NEM az ECHO hibája: a táblázatait rendesen `overflow-x-auto`
       burkolja. A rács- és flex-elemek CSS-alapértelmezett
       `min-width: auto` értéke a bűnös — ez megtiltja, hogy egy elem a
       tartalma minimális szélessége ALÁ zsugorodjon. A mért lánc:

         .flex.items-baseline > span.truncate   min-content = 289 px
           -> a flex sor                        min-content = 396 px
           -> .lg:col-span-2 (rács-elem)        min-content = 446 px
           -> a rács sávja 446 px lett egy 358 px-es dobozban -> lapgörgetés

       A `min-width: 0` visszaadja a zsugorodás jogát, és ilyenkor a már
       meglévő `truncate` / `overflow-x-auto` végre érvényre is jut.
       A `flex-none` (flex-shrink: 0) elemeket ez NEM érinti — az ikonok és
       a rögzített szélességű vezérlők a helyükön maradnak.

       Hatókör: 1024 px alatt. Efölött MÉRÉS SZERINT egyetlen nézet sem
       lógott túl, ezért ott nem nyúlunk az elrendezésbe.
       ============================================================ */
    @media (max-width: 1023px) {
      main .grid > *,
      main .flex > * { min-width: 0; }
    }
    /* ============================================================
       Hosszú, tördelhetetlen szavak
       ------------------------------------------------------------
       MÉRVE (1024 px, KINYITOTT oldalsáv, Riportok nézet): a lap törzse
       1043 px-re görgött. Ok: a `lg:grid-cols-3` rács ekkor 672 px-en
       HÁROM oszlopot nyit, így egy kártya belső szélessége 158 px — a benne
       ülő h4 leghosszabb szava viszont 209 px. A magyar összetett szavak
       (pl. „nemzetköziesítés”) rendszeresen ilyen hosszúak.

       A `break-word` csak azt a szót töri meg, amelyik MÁSKÉPP KILÓGNA;
       a `white-space: nowrap` / `truncate` elemeket (táblázatfejlécek,
       csonkolt sorok) nem érinti, tehát a meglévő tördelés érintetlen.
       Nem szűkítjük töréspontra: ez a szabály minden szélességen helyes.
       ============================================================ */
    main { overflow-wrap: break-word; }
    /* ============================================================
       Reszponzív keret — az oldalsáv és a fő tartalom együttmozgása
       ------------------------------------------------------------
       Az állapotot a React teszi ki a <body data-sidebar="..."> attribútumra
       (app.jsx: useSidebarLayout): 'expanded' | 'collapsed' | 'hidden'.
       A React-en belüli elemek Tailwind-osztályt kapnak; ide az kerül, amit
       osztállyal nem lehet megoldani: az átmenetek, a fókusz-kezelés és az a
       néhány fixen pozicionált elem, ami NEM a mi fánkban él.
       ============================================================ */
    .nje-sidebar { transition: width .3s ease, transform .3s ease, visibility .3s; }
    /* Csukott mobil fiók: a visibility kiveszi a TAB-sorrendből is, de csak az
       animáció végén — így a kicsúszás látszik. */
    .nje-sidebar[data-hidden="true"] { visibility: hidden; }
    .nje-sidebar-backdrop { transition: opacity .3s ease; }
    .nje-shell-main { transition: margin-left .3s ease; }
    .nje-sidebar-toggle { transition: background-color .2s ease, color .2s ease; }

    /* Az ECHO kitöltő alsó akciósávja (features/echo.jsx) fixen, `left-72`
       értékkel pozicionál. Nem nyúlunk az ECHO-hoz: a sáv állapota szerint
       innen igazítjuk, hogy összecsukott sávnál és mobilon se maradjon rés. */
    .fixed.bottom-0.left-72 { transition: left .3s ease; }
    body[data-sidebar="collapsed"] .fixed.bottom-0.left-72 { left: 5rem; }
    body[data-sidebar="hidden"]    .fixed.bottom-0.left-72 { left: 0; }

    /* Ugyanez a sáv takarásba kerülne a lebegő asszisztens-gombtól. Amíg a
       kitöltő nyitva van, a gomb és a chat-panel fölé emelkedik. */
    body:has(.fixed.bottom-0.left-72) .nje-assistant-slot > button { bottom: 5.75rem; }
    body:has(.fixed.bottom-0.left-72) .nje-assistant-slot > div    { bottom: 11.5rem; }

    /* Aki kevesebb mozgást kért, annak a keret ne animáljon. */
    @media (prefers-reduced-motion: reduce) {
      .nje-sidebar, .nje-sidebar-backdrop, .nje-shell-main,
      .nje-sidebar-toggle, .fixed.bottom-0.left-72 { transition: none !important; }
    }

    #__boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #fff; font-family: 'Inter', sans-serif; z-index: 9999; }
    #__boot .s { width: 48px; height: 48px; border: 4px solid rgb(208,103,0); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Babel is only needed by the no-build fallback path; it is loaded on
       demand there (see boot() below) so a built deploy never pays for it. -->
  <!-- Supabase client (Step 4: live backend) -->

  <!-- Futásidejű beállítás (Dockerben a .env-ből; GitHub Pages-en üres). -->
  <script src="config.js"></script>
  <script>
    window.SUPABASE_URL = window.SUPABASE_URL || 'https://mdccyastwhzwtyukxlpk.supabase.co';
    window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_S6syNS_lBfb93fT54WaLJg_aYNDqv9M';
    /* Ha a jelszó-visszaállító link ide érkezett (pl. mert a Supabase az
       alapcímre küldte), a kliens itt új jelszó NÉLKÜL léptetné be a
       felhasználót. Ehelyett továbbadjuk a reset-password.html-nek, a címsor
       tartalmával együtt — és itt nem is dolgozzuk fel a linket. */
    window.__RECOVERY_REDIRECT = /(^|[#&])type=recovery(&|$)/.test(location.hash);
    if (window.__RECOVERY_REDIRECT) location.replace('reset-password.html' + location.hash);
    try {
      window.sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY,
        window.__RECOVERY_REDIRECT ? { auth: { detectSessionInUrl: false } } : undefined);
    } catch (e) { console.error('Failed to init Supabase client', e); }
  </script>

<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
  <div id="__boot"><div class="s"></div></div>
  <div id="root"></div>
  <script type="module">
    // Fast path: `npm run build` (and the Pages workflow) precompiles app.jsx +
    // features/*.jsx into app.bundle.js with esbuild, so the browser skips the
    // slow in-page Babel pass entirely. Without a build (plain `python3 -m
    // http.server`) the file is absent and we fall back to compiling in-page.
    // A csomag tartalmi ujjlenyomata. A build.mjs irja ide minden forditasnal,
    // ES CSAK AKKOR VALTOZIK, ha a csomag tartalma valtozott.
    // MIERT KELL: a GitHub Pages 'cache-control: max-age=600' fejlecet ad az
    // app.bundle.js-re, a dinamikus import pedig verziojel nelkul ugyanarra az
    // URL-re mutatott. Egy kiadas utan a bongeszo tehat akar tiz percig — sajat
    // modul-gyorsitotarabol pedig tovabb — a REGI kodot futtatta, es a
    // felhasznalo joggal hitte, hogy a javitas nem keszult el. Mert(ve): az elo
    // csomagban mar benne volt a javitas, a bongeszo megis a regit mutatta.
    const BUNDLE_V = '6304c6b5d5c9';
    const BUNDLE_URL = './app.bundle.js?v=' + BUNDLE_V;

    async function hasPrebuilt() {
      try { return (await fetch(BUNDLE_URL, { method: 'HEAD' })).ok; }
      catch (e) { return false; }
    }

    function loadBabel() {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js';
        s.integrity = 'sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y';
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load @babel/standalone'));
        document.head.appendChild(s);
      });
    }

    async function boot() {
      try {
        // Deliberately outside the fallback: a runtime error inside the bundle
        // must surface as an error, not silently re-mount the app via Babel.
        if (await hasPrebuilt()) { await import(BUNDLE_URL); return; }
        let src = await (await fetch('app.jsx')).text();
        // New feature modules are concatenated into app.jsx's module (shared
        // scope) at the /*__FEATURES__*/ marker, just before the App component.
        const FEATURE_FILES = ['features/data-layer.jsx', 'features/perm.jsx', 'features/countries.jsx', 'features/echo.jsx', 'features/knowledge-base.jsx', 'features/feed.jsx', 'features/programs.jsx', 'features/assistant.jsx', 'features/registrations.jsx', 'features/interview.jsx', 'features/interview-calendar.jsx', 'features/messages.jsx', 'features/student-calendar.jsx', 'features/recordings.jsx', 'features/dorm.jsx', 'features/dorm-views.jsx', 'features/agency.jsx', 'features/multiprogram.jsx', 'features/groups.jsx', 'features/roles.jsx', 'features/courses.jsx', 'features/teachers.jsx', 'features/students.jsx', 'features/legal.jsx', 'features/access.jsx'];
        try {
          const parts = await Promise.all(FEATURE_FILES.map(f => fetch(f).then(r => r.ok ? r.text() : '')));
          const featureCode = parts.join('\n\n');
          if (src.indexOf('/*__FEATURES__*/') >= 0) src = src.replace('/*__FEATURES__*/', featureCode);
          else src += '\n\n' + featureCode;
        } catch (e) { console.error('Feature modules failed to load', e); }
        // Cache the compiled output keyed by source length so repeat visits
        // skip the (slow) Babel pass and load near-instantly.
        const cacheKey = 'uniportal_compiled_v4';
        const cacheLenKey = 'uniportal_compiled_len_v4';
        // Drop superseded compile caches so we don't hit the localStorage quota
        // (these hold regenerable compiled code only — never user data).
        try { ['uniportal_compiled_v3', 'uniportal_compiled_len_v3'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
        let code;
        try {
          if (localStorage.getItem(cacheLenKey) === String(src.length)) {
            code = localStorage.getItem(cacheKey) || null;
          }
        } catch (e) {}
        if (!code) {
          await loadBabel();
          code = Babel.transform(src, {
            filename: 'app.tsx',
            sourceType: 'module',
            compact: true,
            comments: false,
            presets: [
              ['typescript', { allExtensions: true, isTSX: true, onlyRemoveTypeImports: true }],
              ['react', { runtime: 'classic' }]
            ]
          }).code;
          try { localStorage.setItem(cacheKey, code); localStorage.setItem(cacheLenKey, String(src.length)); } catch (e) { try { localStorage.removeItem(cacheKey); localStorage.removeItem(cacheLenKey); } catch (e2) {} }
        }
        const blob = new Blob([code], { type: 'text/javascript' });
        const url = URL.createObjectURL(blob);
        await import(url);
      } catch (err) {
        console.error(err);
        const boot = document.getElementById('__boot');
        if (boot) {
          boot.style.flexDirection = 'column';
          boot.style.padding = '40px';
          boot.innerHTML = '<div style="max-width:760px;font-family:monospace;color:#fca5a5;white-space:pre-wrap;font-size:13px;line-height:1.5">Hiba az alkalmazás betöltésekor:\n\n' +
            String(err && (err.stack || err.message || err)).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>';
        }
      }
    }
    boot();
  </script>
</body>
